# Stack de producao (single-host). Ver docs/guides/DEPLOYMENT.md.
#
#   cp .env.prod.example .env    # NAO existe no repo: monte a partir de
#                                # backend/.env.example + as chaves daqui
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# NENHUM valor aqui e segredo. Toda chave sensivel vem do ambiente
# (`${VAR:?mensagem}` = falha explicita se nao estiver definida).

name: crm-lab-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crm_lab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # So roda no primeiro init do volume. Cria o banco `evolution` — o
      # compose so provisiona o banco de POSTGRES_DB (`crm_lab`).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem `ports:` — o banco so existe na rede interna do compose.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # Job de migracao: roda ate o fim e sai. `run --rm migrate` antes de todo
  # `up` que inclua migracao nova (DEPLOYMENT.md "Passo de migracao").
  migrate:
    image: crm-lab-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # O migrator carrega o MESMO `config/env.ts` do servidor, que em
      # `NODE_ENV=production` exige esta chave (D-076) antes de rodar qualquer
      # linha. Sem ela aqui o job morria no boot — migracao nenhuma era
      # aplicada, apesar de o `backend` ja receber a variavel.
      CHANNEL_SECRET_KEY: ${CHANNEL_SECRET_KEY:?defina CHANNEL_SECRET_KEY (>=32 caracteres)}
    command: ['node', 'dist/backend/src/db/cli/migrate.js']

  backend:
    image: crm-lab-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGIN: ${CORS_ORIGIN:?defina CORS_ORIGIN}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      # Um unico proxy (o servico `frontend`/nginx) fica entre o cliente e a API.
      # Sem isto o default seguro (0) ignora o X-Forwarded-For e TODO o trafego
      # anonimo colapsa no IP do nginx — o balde por IP vira global. Contar hops
      # a mais e o erro perigoso: o cliente volta a forjar a origem (D-057).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      # Gateway Evolution API (D-083, Onda 7 Bloco B) — conexao WhatsApp por QR.
      # As tres vazias = funcionalidade desligada com erro claro
      # (CHANNEL_QR_UNAVAILABLE), nunca crash de boot; WHATSAPP_API_* acima
      # continua funcionando sem elas.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      # Endereco do backend VISTO DE DENTRO do container `evolution` (rede do
      # compose), nao o do navegador: e para ca que o gateway posta os eventos.
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL:-http://backend:3000}
      # Cifra `tenant_channels.api_token`/`webhook_secret` em repouso (D-076).
      # Sem ela o backend NAO SOBE em producao — e proposital.
      CHANNEL_SECRET_KEY: ${CHANNEL_SECRET_KEY:?defina CHANNEL_SECRET_KEY (>=32 caracteres)}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Sem `ports:` — quem expoe a API e o nginx do frontend, no mesmo origin.

  frontend:
    image: crm-lab-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Mesmo origin: o nginx da propria imagem faz proxy de /api e /ws.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:3000
    ports:
      - '${HTTP_PORT:-8080}:8080'
    security_opt:
      - no-new-privileges:true

  # Gateway Evolution API self-hosted (D-083) — conexao WhatsApp por QR (Onda 7,
  # Bloco B). Versao fixada na v2.3.7 (ultima sem exigencia de ativacao de
  # licenca). SEM `ports:` de proposito — um Evolution admin API exposto
  # publicamente com chave conhecida e sequestro total do WhatsApp do
  # laboratorio; so o nginx do `frontend` expoe porta (D-051). A chave e a
  # MESMA `EVOLUTION_API_KEY` que o `backend` usa para chamar o gateway.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Placeholder obvio quando a integracao QR nao esta em uso — quem
      # configura EVOLUTION_API_KEY de verdade sobrescreve os dois lados
      # (aqui e no `backend` acima) de uma vez, pela mesma variavel.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-antes-de-usar}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/1
    security_opt:
      - no-new-privileges:true
    # Sem `ports:` — so acessivel na rede interna do compose (o `backend`
    # fala com ele por `http://evolution:8080`).

volumes:
  postgres-data:
  redis-data:
