# Stack de producao (single-host). Ver docs/guides/DEPLOYMENT.md.
#
#   cp .env.prod.example .env    # NAO existe no repo: monte a partir de
#                                # backend/.env.example + as chaves daqui
#   docker compose -f docker-compose.prod.yml pull   # imagens do GHCR (CI as publica)
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# NENHUM valor aqui e segredo. Toda chave sensivel vem do ambiente
# (`${VAR:?mensagem}` = falha explicita se nao estiver definida).
#
# `IMAGE_REGISTRY` (CRMLAB-36): prefixo das imagens `backend`/`frontend`/
# `migrate`. Vazio (default, uso local/dev) = nome de imagem sem registry,
# construida por `build:` abaixo. Em produção/homologação o `.env` define
# `IMAGE_REGISTRY=ghcr.io/<owner>/` (barra final) e `deploy.sh` faz `pull` em
# vez de `build` — ver docs/guides/DEPLOYMENT.md §2 e ENVIRONMENTS.md §7. O
# bloco `build:` continua aqui só como FALLBACK documentado (build local
# manual: `docker compose -f docker-compose.prod.yml build`), não é mais o
# caminho normal de deploy.

name: crm-lab-prod

services:
  postgres:
    # Pinada por digest (CRMLAB-36) — a tag sozinha muda de conteúdo sob o pé.
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    restart: unless-stopped
    mem_limit: 1536m
    # `shared_buffers`/`effective_cache_size` no default (128MB/4GB) deixam
    # sobrando a maior parte dos 7,7 GB da VPS sem uso (CRMLAB-36 — auditoria
    # de 19/09 mediu 13 MB usados). `log_min_duration_statement` expõe query
    # lenta sem logar toda query (isso já e' `LOG_LEVEL`, não Postgres).
    # `effective_cache_size` = ~o que sobra do cgroup depois de
    # `shared_buffers` (1536m - 512MB ≈ 1GB), nao 2GB: o planejador acreditava
    # em 2 GB de cache de pagina que o cgroup nunca vai ter e preferia planos
    # que na pratica iam para disco (revisao do PR #46). `shm_size`: com
    # `shared_buffers` em 512MB, os 64 MB default de /dev/shm estouram em
    # "could not resize shared memory segment" assim que dois parallel hash
    # joins rodam juntos.
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crm_lab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # So roda no primeiro init do volume. Cria o banco `evolution` — o
      # compose so provisiona o banco de POSTGRES_DB (`crm_lab`).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem `ports:` — o banco so existe na rede interna do compose.

  redis:
    # Pinada por digest (CRMLAB-36).
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    restart: unless-stopped
    mem_limit: 256m
    # `maxmemory` (CRMLAB-36): sem teto, `maxmemory-policy` default
    # `noeviction` vira erro de ESCRITA quando a RAM aperta — e foi isso que
    # derrubava o rate limit em 500 global (ver CRMLAB-34).
    #
    # 128mb, nao 200mb (revisao do PR #46): `maxmemory` limita so o DATASET.
    # Fragmentacao do alocador, buffers de cliente e as paginas copy-on-write
    # do fork do BGREWRITEAOF ficam POR CIMA — com 200mb de dataset num cgroup
    # de 256m o Redis era morto por OOM antes de a evicção LRU sequer entrar.
    # ~2x de folga e a regra pratica com `appendonly yes`.
    #
    # `allkeys-lru` com uma ressalva registrada (D-167): duas chaves de
    # SEGURANCA moram neste mesmo Redis — o contador de lockout do login e o
    # nonce de anti-replay dos webhooks — e sob pressao de memoria a LRU pode
    # evictar as duas. Risco aceito por enquanto: com 128mb para um cache de
    # analytics/catalogo de um punhado de tenants, pressao de memoria e um
    # cenario teorico; `noeviction` trocaria esse risco por 503 em todo login
    # quando o cache enchesse. Reavaliar quando houver mais de ~10 tenants.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # Job de migracao: roda ate o fim e sai. `run --rm migrate` antes de todo
  # `up` que inclua migracao nova (DEPLOYMENT.md "Passo de migracao").
  migrate:
    image: ${IMAGE_REGISTRY:-}crm-lab-backend:${IMAGE_TAG:-latest}
    # Fallback local (ver nota no topo do arquivo) — `deploy.sh` usa `pull`.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: 'no'
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # `MIGRATE_DATABASE_URL` (D-165): a migracao precisa de DDL, entao roda
      # como a role DONA do banco. Quando a `DATABASE_URL` do `backend` passar
      # a usar `crm_login` (sem superuser, sem DDL), este job precisa da URL
      # antiga — senao o primeiro `CREATE TABLE` da proxima migracao falha com
      # "permission denied". Sem `MIGRATE_DATABASE_URL` no .env, cai na
      # `DATABASE_URL` (comportamento de sempre).
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-${DATABASE_URL:?defina DATABASE_URL}}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # O migrator carrega o MESMO `config/env.ts` do servidor, que em
      # `NODE_ENV=production` exige esta chave (D-076) antes de rodar qualquer
      # linha. Sem ela aqui o job morria no boot — migracao nenhuma era
      # aplicada, apesar de o `backend` ja receber a variavel.
      CHANNEL_SECRET_KEY: ${CHANNEL_SECRET_KEY:?defina CHANNEL_SECRET_KEY (>=32 caracteres)}
      # O migrator carrega o MESMO `config/env.ts`, que em produção exige
      # `MEDIA_DIR` (Onda 8 §4) antes de rodar qualquer linha — mesmo o job de
      # migração nunca gravando mídia. O valor não precisa bater com o volume
      # do `backend`: este processo só valida e sai.
      MEDIA_DIR: /data/media
    command: ['node', 'dist/backend/src/db/cli/migrate.js']

  backend:
    image: ${IMAGE_REGISTRY:-}crm-lab-backend:${IMAGE_TAG:-latest}
    # Fallback local (ver nota no topo do arquivo) — `deploy.sh` usa `pull`.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    # `mem_limit` sem `--max-old-space-size` e armadilha (revisao do PR #46):
    # o V8 dimensiona o heap default pela RAM do HOST (7,7 GB), nao pelo
    # cgroup — ele nunca sente pressao, nunca coleta agressivamente, e o
    # cgroup mata o processo com exit 137 no lugar de um GC. Com o teto
    # explicito em ~75% do limite, o Node coleta antes de o kernel matar.
    # (`NODE_OPTIONS` esta no bloco `environment` abaixo.)
    # Teto de ~1000 descritores (default 1024) somando WebSocket + conexoes
    # pg/Redis + arquivos de midia vira gargalo antes de qualquer outro limite
    # com algumas centenas de atendentes online (CRMLAB-36).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGIN: ${CORS_ORIGIN:?defina CORS_ORIGIN}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      # Um unico proxy (o servico `frontend`/nginx) fica entre o cliente e a API.
      # Sem isto o default seguro (0) ignora o X-Forwarded-For e TODO o trafego
      # anonimo colapsa no IP do nginx — o balde por IP vira global. Contar hops
      # a mais e o erro perigoso: o cliente volta a forjar a origem (D-057).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      # Gateway Evolution API (D-083, Onda 7 Bloco B) — conexao WhatsApp por QR.
      # As tres vazias = funcionalidade desligada com erro claro
      # (CHANNEL_QR_UNAVAILABLE), nunca crash de boot; WHATSAPP_API_* acima
      # continua funcionando sem elas.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      # Endereco do backend VISTO DE DENTRO do container `evolution` (rede do
      # compose), nao o do navegador: e para ca que o gateway posta os eventos.
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL:-http://backend:3000}
      # Cifra `tenant_channels.api_token`/`webhook_secret` em repouso (D-076).
      # Sem ela o backend NAO SOBE em producao — e proposital.
      CHANNEL_SECRET_KEY: ${CHANNEL_SECRET_KEY:?defina CHANNEL_SECRET_KEY (>=32 caracteres)}
      # Mídia de mensagem (Onda 8 §4) — volume local, sem MinIO/S3 nesta onda.
      # Obrigatoria em producao (mesma razao de CHANNEL_SECRET_KEY): sem ela o
      # backend nao sobe. O caminho e o mount point do volume `media-data`
      # logo abaixo — unica escrita permitida com `read_only: true` na raiz.
      MEDIA_DIR: /data/media
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - media-data:/data/media
    security_opt:
      - no-new-privileges:true
    # Sem `ports:` — quem expoe a API e o nginx do frontend, no mesmo origin.

  frontend:
    # `IMAGE_TAG` ja distingue producao (`<sha>`) de homologacao (`hml-<sha>`,
    # `deploy.sh` §PREFIXO_TAG) — sao builds DIFERENTES (VITE_APP_ENV inlinado
    # no bundle), entao o CI publica as duas variantes com essas mesmas tags.
    image: ${IMAGE_REGISTRY:-}crm-lab-frontend:${IMAGE_TAG:-latest}
    # Fallback local (ver nota no topo do arquivo) — `deploy.sh` usa `pull`.
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Mesmo origin: o nginx da propria imagem faz proxy de /api e /ws.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
        # `APP_ENV` do .env do ambiente. Producao nao define nada e cai no
        # default; homologacao define `homologacao` e ganha o selo na tela.
        VITE_APP_ENV: ${APP_ENV:-production}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:3000
    ports:
      - '${HTTP_PORT:-8080}:8080'
    security_opt:
      - no-new-privileges:true

  # Gateway Evolution API self-hosted (D-083) — conexao WhatsApp por QR (Onda 7,
  # Bloco B). Versao fixada na v2.3.7 (ultima sem exigencia de ativacao de
  # licenca). SEM `ports:` de proposito — um Evolution admin API exposto
  # publicamente com chave conhecida e sequestro total do WhatsApp do
  # laboratorio; so o nginx do `frontend` expoe porta (D-051). A chave e a
  # MESMA `EVOLUTION_API_KEY` que o `backend` usa para chamar o gateway.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    mem_limit: 768m
    # `user: "1000:1000"` NAO aplicado aqui — ver D-140 em docs/DECISIONS.md:
    # imagem de terceiro, sem como validar da CI/de fora da VPS se o volume
    # de sessao (Baileys) aceita rodar sem root. Ficou registrado como
    # pendencia de validacao manual em homologacao antes de aplicar em
    # producao.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Placeholder obvio quando a integracao QR nao esta em uso — quem
      # configura EVOLUTION_API_KEY de verdade sobrescreve os dois lados
      # (aqui e no `backend` acima) de uma vez, pela mesma variavel.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave-antes-de-usar}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/1
    security_opt:
      - no-new-privileges:true
    # Auditoria de 2026-09-17: o container ficou "vivo mas quebrado" — a sessao
    # Baileys tinha morrido (401) e ele seguia respondendo `state: "open"` para
    # uma sessao inexistente, sem nunca reiniciar. `restart: unless-stopped`
    # sozinho nao cobre isso, porque o processo nao caiu. O healthcheck ao
    # menos deixa o estado VISIVEL no `docker ps` em vez de silencioso.
    #
    # Deliberadamente so a porta HTTP: um healthcheck que consultasse
    # `connectionState` marcaria o container como doente toda vez que o numero
    # estivesse legitimamente desconectado (ninguem pareou ainda), e um
    # healthcheck que mente e pior que nenhum.
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        # A rotacao padrao reteve so ~2h de log e foi o que impediu, na
        # auditoria, achar a causa raiz da sessao derrubada: o momento da
        # queda ja tinha rotacionado quando fomos olhar.
        max-size: '50m'
        max-file: '5'
    # Sem `ports:` — so acessivel na rede interna do compose (o `backend`
    # fala com ele por `http://evolution:8080`).

volumes:
  postgres-data:
  redis-data:
  media-data:
