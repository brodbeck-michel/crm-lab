services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-lab-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_lab
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # So roda no primeiro init do volume (imagem oficial do Postgres). Cria o
      # banco `evolution` — o compose so provisiona `crm_lab` via POSTGRES_DB.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_lab']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crm-lab-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Gateway Evolution API self-hosted (D-083) — conexao de WhatsApp por QR code
  # (Onda 7, Bloco B). Versao fixada na v2.3.7: a ultima sem exigencia de
  # ativacao de licenca (linha 2.4.x depende de heartbeat externo). Porta 8080
  # exposta so em DEV — `docker-compose.prod.yml` NAO publica porta nenhuma.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: crm-lab-evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Placeholder obvio de dev — em producao vem de `${EVOLUTION_API_KEY:?...}`.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-local-placeholder-key}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://crm:crm@postgres:5432/evolution
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
