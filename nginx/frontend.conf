# Nginx da imagem do frontend (SPA estatica + proxy para a API).
#
# Este arquivo e um TEMPLATE de conf.d (contexto `http`): so pode conter
# diretivas de `server`/`location`. O `pid` fica em /tmp via edicao do
# nginx.conf principal, feita no Dockerfile — a imagem roda como usuario
# nao-root, e por isso a porta e 8080 (portas < 1024 exigem root).
#
# `API_UPSTREAM` e substituida por envsubst no entrypoint da imagem oficial
# (/docker-entrypoint.d/20-envsubst-on-templates.sh). Default do
# docker-compose.prod.yml: http://backend:3000.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Cabecalhos minimos. HSTS/TLS ficam no proxy de borda, nao aqui.
    add_header X-Content-Type-Options nosniff  always;
    add_header X-Frame-Options        DENY     always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # CSP (CRMLAB-32) — Report-Only por enquanto: so registra violacao, nao
    # bloqueia nada. Promover para `Content-Security-Policy` (enforce) depois
    # de 1 semana observando homologacao sem relatorio inesperado — nao ha
    # `dangerouslySetInnerHTML`/`innerHTML` hoje, entao o vetor e dependencia de
    # terceiros (jspdf, recharts, xlsx) ou descuido futuro; a politica e o
    # cinto de seguranca contra os dois. `connect-src wss:` cobre o WebSocket
    # (`/ws`, mesmo origin) sem abrir para outros hosts.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # LIVENESS DESTE CONTAINER, e so isso (CRMLAB-29).
    #
    # Responde `ok` sem tocar no backend: serve para saber que o nginx subiu e
    # esta servindo, nada alem. NAO aponte deploy nem monitor externo para ca —
    # ele responde 200 com o backend morto, com o Postgres fora e com o Redis
    # fora, e foi exatamente isso que fez o deploy declarar "no ar" para uma
    # stack quebrada ate 19/09/2026.
    #
    # Saude de verdade: `GET /api/v1/health`, que atravessa o `location /api/`
    # abaixo ate o backend e responde 503 quando uma dependencia cai.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Assets com hash no nome: imutaveis.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API e WebSocket no mesmo origin: elimina CORS e preflight no browser.
    location /api/ {
        # 25m espelha o `express.json({ limit: '25mb' })` do backend
        # (backend/src/app.ts): midia viaja em base64 dentro do JSON e infla
        # ~33%, entao os 15 MiB por arquivo do `MediaService` so cabem com
        # folga de envelope. Sem isto vale o default do nginx (1 MiB) e o
        # anexo morre num 413 cru da borda, aos ~750 KB de arquivo, antes de
        # o backend poder responder o `MEDIA_TOO_LARGE` do catalogo de erros.
        # Fica so aqui, e nao no `server`: o resto deste vhost serve arquivo
        # estatico e nao recebe corpo nenhum.
        client_max_body_size 25m;

        proxy_pass         ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass         ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # SPA: qualquer rota do react-router cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache: e ele que aponta para o bundle novo.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
