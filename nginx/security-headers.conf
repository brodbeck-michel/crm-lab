# Headers de seguranca do frontend — UM arquivo, incluido em TODA location que
# declara `add_header` proprio (D-144, revisada em CRMLAB-42).
#
# `add_header` no nginx NAO herda entre niveis quando a location tambem tem o
# seu: a lista do `server {}` e substituida inteira. A D-144 corrigiu isso
# repetindo os headers em duas locations e afirmando um invariante de "3
# copias" que ja estava errado no dia em que foi escrito — `location =
# /healthz` tambem tinha `add_header` e ficou sem nenhum destes. Com o
# `include`, a proxima location que ganhar um `add_header` precisa de UMA
# linha, nao de cinco, e nao ha invariante para esquecer.
#
# CSP: `connect-src 'self'` ja permite o WebSocket do mesmo origin (CSP3 trata
# ws(s) do proprio origin como 'self'). O `wss:` que estava aqui abria a
# politica para QUALQUER host wss:// — exatamente o canal que um script
# injetado usaria para exfiltrar, sem gerar relatorio (revisao do PR #44).
add_header X-Content-Type-Options nosniff  always;
add_header X-Frame-Options        DENY     always;
add_header Referrer-Policy        no-referrer-when-downgrade always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
